<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miracle · генератор визуалов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#000000;
    --ivory:#F2EBDD;
    --steel:#6E8CA8;
    --slate:#2E3F52;

    --ui-bg:#0d0f12;
    --ui-panel:#15181d;
    --ui-line:#242931;
    --ui-text:#e7e9ec;
    --ui-dim:#878e99;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--ui-bg);
    color:var(--ui-text);
    font:400 14px/1.5 Outfit,system-ui,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 24px 64px;
    gap:28px;
  }

  .stage{
    width:100%;
    max-width:980px;
    display:flex;
    justify-content:center;
  }
  canvas#card{
    width:100%;
    height:auto;
    display:block;
    border-radius:10px;
    box-shadow:0 24px 70px rgba(0,0,0,.65);
  }

  .controls{
    width:100%;
    max-width:980px;
    background:var(--ui-panel);
    border:1px solid var(--ui-line);
    border-radius:12px;
    padding:20px;
    display:grid;
    grid-template-columns:1fr 260px;
    gap:20px;
  }
  @media (max-width:760px){ .controls{grid-template-columns:1fr} }

  label{display:block;color:var(--ui-dim);margin-bottom:7px;font-size:12px}

  textarea,select{
    width:100%;
    background:#0b0d10;
    color:var(--ui-text);
    border:1px solid var(--ui-line);
    border-radius:8px;
    padding:11px 12px;
    font:400 14px/1.45 Outfit,sans-serif;
    resize:vertical;
  }
  textarea{min-height:92px}
  textarea:focus,select:focus{outline:2px solid var(--steel);outline-offset:1px}

  .side{display:flex;flex-direction:column;gap:14px}
  .row{display:flex;gap:8px;flex-wrap:wrap}

  button{
    flex:1;
    min-width:110px;
    background:#1d2128;
    color:var(--ui-text);
    border:1px solid var(--ui-line);
    border-radius:8px;
    padding:10px 14px;
    font:500 13px Outfit,sans-serif;
    cursor:pointer;
  }
  button:hover{background:#252a33}
  button:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
  button.primary{background:var(--ivory);color:#111;border-color:var(--ivory)}
  button.primary:hover{background:#fff}

  .check{display:flex;align-items:center;gap:9px;color:var(--ui-dim);font-size:13px;cursor:pointer}
  .check input{accent-color:var(--steel);width:15px;height:15px}

  .presets{display:flex;flex-direction:column;gap:5px}
  .presets button{
    flex:none;text-align:left;font-weight:400;font-size:12.5px;
    padding:8px 11px;color:var(--ui-dim);background:transparent;
  }
  .presets button:hover{background:#1d2128;color:var(--ui-text)}

  .hint{color:var(--ui-dim);font-size:12px;max-width:980px;text-align:center;line-height:1.6}
</style>
</head>
<body>

<div class="stage"><canvas id="card"></canvas></div>

<div class="controls">
  <div>
    <label for="text">Текст карточки</label>
    <textarea id="text">same capital for everyone.
the best trader wins.</textarea>

    <div class="presets" style="margin-top:14px">
      <button data-line="a trading game you can verify yourself">a trading game you can verify yourself</button>
      <button data-line="same capital for everyone.&#10;the best trader wins.">same capital for everyone. / the best trader wins.</button>
      <button data-line="if we could edit your score,&#10;it wouldn't be a score.">if we could edit your score, it wouldn't be a score.</button>
      <button data-line="we don't publish the prices.&#10;that's the point.">we don't publish the prices. that's the point.</button>
      <button data-line="leverage is earned,&#10;not bought.">leverage is earned, not bought.</button>
    </div>
  </div>

  <div class="side">
    <div>
      <label for="preset">Формат</label>
      <select id="preset">
        <option value="post">Пост 16:9 — 1600 × 900</option>
        <option value="square">Квадрат — 1080 × 1080</option>
        <option value="banner">Баннер X — 1500 × 500</option>
      </select>
    </div>

    <label class="check"><input type="checkbox" id="mark" checked> Вордмарк на карточке</label>
    <label class="check"><input type="checkbox" id="guides"> Показать зоны обрезки</label>

    <div class="row">
      <button id="shuffle">Другой свет</button>
      <button id="download" class="primary">Скачать PNG</button>
    </div>
  </div>
</div>

<p class="hint">
  «Зоны обрезки» показывают, где аватар и мобильный кроп съедают баннер. На экспорт они не попадают.
</p>

<script>
const PRESETS = {
  post:   { w:1600, h:900,  pitch:13, pad:0.075, size:66, lh:1.28, maxw:0.62 },
  square: { w:1080, h:1080, pitch:11, pad:0.085, size:58, lh:1.30, maxw:0.78 },
  banner: { w:1500, h:500,  pitch:12, pad:0.055, size:44, lh:1.25, maxw:0.50 }
};

const cv    = document.getElementById('card');
const ctx   = cv.getContext('2d');
const elTxt = document.getElementById('text');
const elPre = document.getElementById('preset');
const elMark= document.getElementById('mark');
const elGuid= document.getElementById('guides');

let seed = 7;

/* Детерминированный ГПСЧ, чтобы один и тот же свет повторялся точно */
function rng(s){ let a = s >>> 0; return () => (a = (a*1664525 + 1013904223) >>> 0) / 4294967296; }

/* Поле света: несколько больших мягких градиентов на чёрном.
   Точки потом берут свой цвет отсюда. */
function lightField(w, h, s){
  const f = document.createElement('canvas');
  f.width = w; f.height = h;
  const c = f.getContext('2d');
  const r = rng(s);

  c.fillStyle = '#000';
  c.fillRect(0, 0, w, h);
  c.globalCompositeOperation = 'lighter';

  const blooms = [
    { x:.74+(r()-.5)*.14, y:.16+(r()-.5)*.12, rad:.62, col:[242,235,221], a:1.00 },
    { x:.46+(r()-.5)*.20, y:.04+(r()-.5)*.10, rad:.34, col:[242,235,221], a:0.45 },
    { x:.01+(r()-.5)*.06, y:.52+(r()-.5)*.24, rad:.46, col:[110,140,168], a:0.85 },
    { x:.92+(r()-.5)*.10, y:.94+(r()-.5)*.12, rad:.40, col:[ 84,116,146], a:0.70 },
    { x:.28+(r()-.5)*.18, y:.88+(r()-.5)*.14, rad:.30, col:[ 46, 63, 82], a:0.60 }
  ];

  const D = Math.max(w, h);
  for (const b of blooms){
    const g = c.createRadialGradient(b.x*w, b.y*h, 0, b.x*w, b.y*h, b.rad*D);
    const [R,G,B] = b.col;
    g.addColorStop(0,   `rgba(${R},${G},${B},${b.a})`);
    g.addColorStop(.45, `rgba(${R},${G},${B},${b.a*0.34})`);
    g.addColorStop(1,   `rgba(${R},${G},${B},0)`);
    c.fillStyle = g;
    c.fillRect(0, 0, w, h);
  }
  return c.getImageData(0, 0, w, h).data;
}

function drawDots(P, s){
  const { w, h, pitch } = P;
  const field = lightField(w, h, s);
  const r = rng(s ^ 0x9e37);
  const rad = pitch * 0.33;

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, h);

  for (let y = pitch/2; y < h; y += pitch){
    for (let x = pitch/2; x < w; x += pitch){
      const i = ((y|0) * w + (x|0)) * 4;
      const jitter = 0.86 + r()*0.30;
      /* Пол яркости: сетка видна даже в чёрных зонах, как в логотипе */
      const R = Math.min(255, field[i]   * jitter + 11);
      const G = Math.min(255, field[i+1] * jitter + 11);
      const B = Math.min(255, field[i+2] * jitter + 13);

      ctx.beginPath();
      ctx.arc(x, y, rad, 0, Math.PI*2);
      ctx.fillStyle = `rgb(${R|0},${G|0},${B|0})`;
      ctx.fill();
    }
  }

  /* Виньетка — собирает кадр и уводит края в чёрный */
  const v = ctx.createRadialGradient(w*.5, h*.5, Math.min(w,h)*.30, w*.5, h*.5, Math.max(w,h)*.78);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,.62)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, w, h);
}

function wrap(text, maxW){
  const out = [];
  for (const para of text.split('\n')){
    if (!para.trim()){ out.push(''); continue; }
    let line = '';
    for (const word of para.trim().split(/\s+/)){
      const test = line ? line + ' ' + word : word;
      if (ctx.measureText(test).width > maxW && line){ out.push(line); line = word; }
      else line = test;
    }
    out.push(line);
  }
  return out;
}

/* Четырёхлучевая искра с вогнутыми гранями — как в логотипе */
function sparkle(x, y, r){
  ctx.beginPath();
  ctx.moveTo(x, y-r);
  ctx.quadraticCurveTo(x+r*.16, y-r*.16, x+r, y);
  ctx.quadraticCurveTo(x+r*.16, y+r*.16, x, y+r);
  ctx.quadraticCurveTo(x-r*.16, y+r*.16, x-r, y);
  ctx.quadraticCurveTo(x-r*.16, y-r*.16, x, y-r);
  ctx.fill();
}

function drawWordmark(P){
  const { w, h } = P;
  const size = Math.round(w * 0.0215);
  const x = P.pad * w;
  const y = h - P.pad * w * 0.72;

  ctx.font = `500 ${size}px Outfit, sans-serif`;
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#fff';
  ctx.globalAlpha = 0.92;
  ctx.fillText('miracle', x, y);

  const tw = ctx.measureText('miracle').width;
  sparkle(x + tw + size*0.42, y - size*0.62, size*0.26);
  sparkle(x + tw + size*0.92, y - size*1.02, size*0.12);
  ctx.globalAlpha = 1;
}

function drawText(P){
  const { w, h } = P;
  const txt = elTxt.value.trim();
  if (!txt) return;

  const size = P.size;
  ctx.font = `400 ${size}px Outfit, sans-serif`;
  ctx.textBaseline = 'alphabetic';

  const lines  = wrap(txt, w * P.maxw);
  const lh     = size * P.lh;
  const blockH = lines.length * lh;
  const x = P.pad * w;
  /* Смещаем чуть выше оптического центра — снизу стоит вордмарк */
  let y = (h - blockH) / 2 + size * 0.84 - (elMark.checked ? size*0.30 : 0);

  ctx.fillStyle = '#fff';
  ctx.shadowColor = 'rgba(255,255,255,.34)';
  ctx.shadowBlur  = size * 0.55;
  for (const line of lines){ ctx.fillText(line, x, y); y += lh; }
  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';
}

function drawGuides(P){
  const { w, h } = P;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,90,90,.85)';
  ctx.setLineDash([9, 7]);
  ctx.lineWidth = 2;

  if (elPre.value === 'banner'){
    const d = w * 0.135;                       // аватар ≈ 200px при 1500
    ctx.beginPath();
    ctx.arc(w*0.075 + d/2, h - d*0.36, d/2, 0, Math.PI*2);
    ctx.stroke();
    const safe = h * 0.72;                     // мобильный кроп
    ctx.strokeRect(0, (h-safe)/2, w, safe);
  } else {
    ctx.strokeRect(w*0.04, h*0.04, w*0.92, h*0.92);
  }
  ctx.restore();
}

function render(){
  const P = PRESETS[elPre.value];
  cv.width = P.w; cv.height = P.h;
  drawDots(P, seed);
  drawText(P);
  if (elMark.checked) drawWordmark(P);
  if (elGuid.checked) drawGuides(P);
}

document.getElementById('shuffle').onclick = () => { seed = (seed * 1103515245 + 12345) >>> 0; render(); };

document.getElementById('download').onclick = () => {
  const wasGuides = elGuid.checked;
  if (wasGuides){ elGuid.checked = false; render(); }
  cv.toBlob(b => {
    const P = PRESETS[elPre.value];
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = `miracle-${elPre.value}-${P.w}x${P.h}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    if (wasGuides){ elGuid.checked = true; render(); }
  }, 'image/png');
};

for (const b of document.querySelectorAll('.presets button'))
  b.onclick = () => { elTxt.value = b.dataset.line; render(); };

for (const el of [elTxt, elPre, elMark, elGuid]) el.addEventListener('input', render);

document.fonts.ready.then(render);
</script>
</body>
</html>
